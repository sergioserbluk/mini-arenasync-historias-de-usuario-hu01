<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mini ArenaSync{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('control') }}">Mini ArenaSync</a>
        <nav class="nav">
            <a href="{{ url_for('control') }}">Control</a>
            <a href="{{ url_for('tablero') }}">Tablero</a>
            <a href="{{ url_for('resultados') }}">Resultados</a>
        </nav>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
